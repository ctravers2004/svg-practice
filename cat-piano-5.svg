  <path d="M320 270 L330 270 L325 276 Z" fill="#f48fb1"/>
  <path d="M325 276 Q321 282 317 279 M325 276 Q329 282 333 279" fill="none" stroke="#4e342e" stroke-width="1.8" stroke-linecap="round"/>

