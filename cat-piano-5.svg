  <g fill="#6a1b9a">
    <text x="552" y="196" font-size="40">♪</text>
    <text x="576" y="146" font-size="50">♫</text>
    <text x="544" y="96" font-size="34">♬</text>
    <text x="600" y="112" font-size="28">♪</text>
