<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a237e"/>
      <stop offset="1" stop-color="#0d1440"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff59d" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff59d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#night)"/>

  <!-- moon + stars -->
  <circle cx="552" cy="70" r="30" fill="#fffde7"/>
  <circle cx="541" cy="63" r="5" fill="#eceff1"/>
  <circle cx="562" cy="80" r="3.5" fill="#eceff1"/>
  <circle cx="547" cy="84" r="3" fill="#eceff1"/>
  <g fill="#fffde7">
    <circle cx="70" cy="50" r="2"/>
    <circle cx="130" cy="90" r="1.6"/>
    <circle cx="200" cy="40" r="2.2"/>
    <circle cx="300" cy="76" r="1.5"/>
    <circle cx="400" cy="44" r="1.8"/>
    <circle cx="470" cy="120" r="1.5"/>
    <circle cx="30" cy="140" r="1.7"/>
    <circle cx="620" cy="170" r="1.6"/>
  </g>

  <!-- window with moonlight -->
  <rect x="40" y="60" width="150" height="180" rx="6" fill="#283593" stroke="#3949ab" stroke-width="6"/>
  <line x1="115" y1="60" x2="115" y2="240" stroke="#3949ab" stroke-width="5"/>
  <line x1="40" y1="150" x2="190" y2="150" stroke="#3949ab" stroke-width="5"/>
  <circle cx="80" cy="105" r="14" fill="#fffde7" opacity="0.9"/>
  <rect x="40" y="240" width="150" height="12" fill="#1a237e"/>

  <!-- lamp glow -->
  <ellipse cx="330" cy="250" rx="230" ry="170" fill="url(#glow)"/>

  <!-- floor -->
  <rect y="352" width="640" height="68" fill="#111a3a"/>
  <rect y="352" width="640" height="4" fill="#1f2a52"/>

  <!-- grand piano body -->
  <path d="M250 120 Q250 96 288 96 L560 96 Q586 96 586 118 L586 176 Q586 196 560 200 L330 200 Q292 200 272 226 Q258 246 250 262 Z" fill="#111111"/>
  <path d="M288 96 L560 96 Q586 96 586 118 L586 130 L296 130 Z" fill="#2b2b2b"/>
  <ellipse cx="404" cy="150" rx="96" ry="34" fill="#1c1c1c"/>
  <rect x="250" y="108" width="336" height="10" rx="5" fill="#3a3a3a"/>
  <!-- raised lid -->
  <path d="M300 96 Q420 46 578 74 L578 96 Z" fill="#181818"/>
  <!-- legs -->
  <rect x="558" y="196" width="18" height="156" fill="#151515"/>
  <rect x="566" y="196" width="4" height="156" fill="#2f2f2f"/>
  <rect x="262" y="238" width="18" height="114" fill="#151515"/>
  <rect x="270" y="238" width="4" height="114" fill="#2f2f2f"/>
  <ellipse cx="567" cy="352" rx="20" ry="6" fill="#0b0b0b"/>
  <ellipse cx="271" cy="352" rx="20" ry="6" fill="#0b0b0b"/>

  <!-- keyboard -->
  <rect x="238" y="248" width="128" height="12" rx="3" fill="#0a0a0a"/>
  <g fill="#f5f5f5">
    <rect x="242" y="258" width="18" height="30" rx="0 0 2 2"/>
    <rect x="260" y="258" width="18" height="30" rx="0 0 2 2"/>
    <rect x="278" y="258" width="18" height="30" rx="0 0 2 2"/>
    <rect x="296" y="258" width="18" height="30" rx="0 0 2 2"/>
    <rect x="314" y="258" width="18" height="30" rx="0 0 2 2"/>
    <rect x="332" y="258" width="18" height="30" rx="0 0 2 2"/>
    <rect x="350" y="258" width="14" height="30" rx="0 0 2 2"/>
  </g>
  <g fill="#0d0d0d">
    <rect x="254" y="258" width="11" height="19"/>
    <rect x="290" y="258" width="11" height="19"/>
    <rect x="326" y="258" width="11" height="19"/>
    <rect x="344" y="258" width="11" height="19"/>
  </g>
  <rect x="238" y="288" width="128" height="8" rx="2" fill="#0a0a0a"/>

  <!-- stool -->
  <rect x="150" y="296" width="86" height="12" rx="5" fill="#4e342e"/>
  <rect x="160" y="308" width="9" height="44" fill="#3e2723"/>
  <rect x="217" y="308" width="9" height="44" fill="#3e2723"/>

  <!-- cat: side profile -->
  <!-- tail -->
  <path d="M132 288 Q92 276 96 240 Q100 212 124 208" fill="none" stroke="#263238" stroke-width="11" stroke-linecap="round"/>
  <path d="M96 240 Q100 212 124 208" fill="none" stroke="#37474f" stroke-width="11" stroke-linecap="round"/>
  <!-- body -->
  <path d="M126 292 Q124 240 172 238 Q220 236 228 276 Q232 292 222 296 L138 296 Q128 296 126 292 Z" fill="#263238"/>
  <path d="M140 268 Q168 258 196 264" fill="none" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
  <!-- hind legs / feet on stool -->
  <path d="M142 296 L136 296" stroke="#1b262c" stroke-width="12" stroke-linecap="round"/>
  <!-- arm reaching to keys -->
  <path d="M212 252 Q242 258 254 272" fill="none" stroke="#263238" stroke-width="13" stroke-linecap="round"/>
  <ellipse cx="256" cy="273" rx="10" ry="8" fill="#455a64"/>
  <!-- second paw resting -->
  <path d="M198 264 Q218 270 228 280" fill="none" stroke="#263238" stroke-width="12" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="196" cy="214" r="27" fill="#263238"/>
  <path d="M178 194 L170 168 L194 186 Z" fill="#263238"/>
  <path d="M214 194 L222 168 L198 186 Z" fill="#263238"/>
  <path d="M181 191 L177 177 L189 185 Z" fill="#455a64"/>
  <path d="M211 191 L215 177 L203 185 Z" fill="#455a64"/>
  <!-- muzzle + eye lit by lamp -->
  <path d="M186 232 Q196 242 208 232 Q204 250 192 246 Z" fill="#455a64"/>
  <circle cx="188" cy="216" r="4" fill="#ffd54f"/>
  <circle cx="186.5" cy="214.5" r="1.4" fill="#fff8e1"/>
  <circle cx="210" cy="214" r="4" fill="#ffd54f"/>
  <circle cx="208.5" cy="212.5" r="1.4" fill="#fff8e1"/>
  <path d="M195 228 L201 228 L198 233 Z" fill="#ef9a9a"/>
  <g stroke="#607d8b" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M188 230 Q176 228 168 228"/>
    <path d="M189 234 Q177 236 169 239"/>
    <path d="M205 230 Q217 227 225 226"/>
    <path d="M204 234 Q216 235 224 237"/>
  </g>

  <!-- music notes rising -->
  <g fill="#ffd54f">
    <text x="286" y="176" font-size="34">♪</text>
    <text x="330" y="130" font-size="42">♫</text>
    <text x="384" y="92" font-size="30">♬</text>
    <text x="292" y="238" font-size="26">♪</text>
    <text x="440" y="60" font-size="22">♪</text>
  </g>
</svg>
